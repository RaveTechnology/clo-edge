modules:
  rancher_ping:
    prober: http
    timeout: 5s
    http:
      valid_status_codes:
      - 200
      method: GET
      follow_redirects: false
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      fail_if_body_not_matches_regexp:
      - ^pong\n?$
      tls_config:
        insecure_skip_verify: false
        min_version: TLS12
  edge_health:
    prober: http
    timeout: 5s
    http:
      valid_status_codes:
      - 200
      method: GET
      follow_redirects: false
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      fail_if_body_not_matches_regexp:
      - ^ok\n?$
      tls_config:
        insecure_skip_verify: false
        min_version: TLS12
