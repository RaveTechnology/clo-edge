name: Controller and evidence checks
'on':
  push:
    branches:
    - main
  pull_request: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
      with:
        go-version: 1.27.1
        cache: true
    - run: make check haproxy-check package
    - run: make image
    - run: docker run --rm --network none local/clo-edge:$(cat VERSION) version
