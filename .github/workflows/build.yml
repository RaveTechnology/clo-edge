name: Research evidence checks
'on':
  push:
    branches:
    - main
  pull_request: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - run: |-
        python3 -m json.tool docs/ip-transfer-2026-11-17.json > /dev/null
        test -s README.md
        test -s LICENSE
